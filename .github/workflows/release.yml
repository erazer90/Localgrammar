name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-package
          path: dist
      - name: Publish verified archive
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --strict --check SHA256SUMS
          zip="LocalGrammarPro-${RELEASE_TAG#v}.zip"
          test -f "$zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing=$(mktemp -d)
            gh release download "$RELEASE_TAG" --pattern "$zip" --pattern SHA256SUMS --dir "$existing"
            cmp "$zip" "$existing/$zip"
            cmp SHA256SUMS "$existing/SHA256SUMS"
          else
            gh release create "$RELEASE_TAG" "$zip" SHA256SUMS --verify-tag --generate-notes \
              --title "Local Grammar Pro ${RELEASE_TAG#v}"
          fi
