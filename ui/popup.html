<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Grammar Pro</title>
  <link rel="stylesheet" href="ui.css">
  <script defer src="../settings.js"></script>
  <script defer src="popup.js"></script>
</head>
<body class="popup">
  <main>
    <header><div class="brand"><img src="../icons/brand.svg" alt=""><span>Local Grammar <b>Pro</b></span></div></header>
    <div class="master"><label class="row"><span>Schreibprüfung<small>Prüft offline auf deinem Gerät.</small></span><input type="checkbox" role="switch" id="enabled" disabled></label></div>
    <div class="card">
      <label class="row"><span>Prüfsprache</span><select id="language" disabled>
          <option value="de">Deutsch (DE)</option>
          <option value="en">Englisch (US)</option>
          <option value="en-GB">Englisch (UK)</option>
          <option value="auto">Automatisch</option>
        </select></label>
      <label class="row"><span>Auf dieser Website<small id="site-label">Keine Website geöffnet</small></span><input type="checkbox" role="switch" id="site" disabled></label>
    </div>
    <button class="settings-link" id="options"><svg class="icon" aria-hidden="true"><use href="symbols.svg#sliders"></use></svg> Einstellungen <svg class="icon" aria-hidden="true"><use href="symbols.svg#arrow"></use></svg></button>
    <p class="status" id="status" role="status"></p>
  </main>
</body>
</html>
